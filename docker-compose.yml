# Deploy on a cheap VPS
#
# 1. Copy app/api/.env.example → app/api/.env and fill secrets
# 2. Set CLIENT_ORIGIN to the public UI origin
# 3. Build web with the public API URL:
#    VITE_API_BASE_URL=https://api.example.com docker compose up --build -d
#
# Secrets never go in the web image — only VITE_API_BASE_URL (public).

services:
  api:
    build:
      context: .
      dockerfile: app/api/Dockerfile
    ports:
      - '4000:4000'
    env_file:
      - ./app/api/.env
    environment:
      NODE_ENV: production
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:4000/api/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  web:
    build:
      context: ./app/web
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:4000}
    ports:
      - '8080:80'
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
